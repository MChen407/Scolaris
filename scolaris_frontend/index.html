<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <base href="./">
    <script>
     // Capture erreurs muettes dans l'ASAR
     window.onerror = (msg, url, line, col, err) => {
       console.error('Renderer error', { msg, url, line, col, err });
       // Afficher une alerte temporaire pour debug en packagé
       // retirez alert() en prod si inutile
       alert('Erreur renderer: ' + msg);
     };
     window.addEventListener('unhandledrejection', e => {
       console.error('Unhandled rejection', e);
       alert('Unhandled rejection: ' + (e.reason?.message || e.reason));
     });
   </script>
    <link rel="icon" type="image/svg+xml" href="./src/assets/logo.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scolaris - Gestion Scolaire</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
